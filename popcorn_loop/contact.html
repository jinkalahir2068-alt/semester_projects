<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Information Portal - POPCORN LOOP</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar d-flex flex-wrap">
    <h3 class="logo">POPCORN LOOP</h3>
    <ul class="nav-links d-flex flex-wrap">
      <li><a href="index.html">Home</a></li>
      <li><a href="movies.html">Movies</a></li>
      <li><a href="favorites.html">Favorites</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </header>

  <section class="section">
    <h2 class="section-title">Contact Us</h2>

    <form class="form-container">

      <div class="form-group">
        <label id="contactName">Name</label>
        <input type="text" id="contactName" placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label id="contactEmail">Email</label>
        <input type="email" id="contactEmail" placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label id="contactSubject">Subject</label>
        <input type="text" id="contactSubject" placeholder="Subject of your message">
      </div>

      <div class="form-group">
        <label id="contactMessage">Message</label>
        <textarea id="contactMessage" placeholder="Write your message here..."></textarea>
      </div>

      <div style="text-align: center;">
        <button type="submit" class="btn btn-primary">SUBMIT</button>
      </div>
    </form>
  </section>

  <footer class="footer">
    <p>&copy; 2026 POPCORN LOOP | Movie Information Portal</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
